[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helixsh"
dynamic = ["version"]
description = "Bioinformatics-first AI shell wrapper for Nextflow and nf-core"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "helixsh contributors" }
]
dependencies = []

[project.scripts]
helixsh = "helixsh.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "helixsh.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Real-execution tests need Nextflow (and Docker for the nf-core tier) and run
# for minutes, so they stay out of the default suite. Select them explicitly:
#   pytest -m integration
#   pytest -m integration_nfcore
addopts = "-m 'not integration and not integration_nfcore'"
markers = [
  "integration: executes real Nextflow against a local workflow",
  "integration_nfcore: executes a real nf-core pipeline; needs Docker",
]
