name: Integration

# These jobs execute Nextflow for real, so they are far slower than the unit
# suite and depend on external pipeline sources. They run nightly and on
# demand rather than on every pull request.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-execution:
    name: Real Nextflow, local workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Install helixsh
        run: python -m pip install .

      - name: Execute a real workflow through the Helixsh execution path
        run: python -m pytest -m integration -v

  nfcore-execution:
    name: Real nf-core pipeline, Docker
    runs-on: ubuntu-24.04
    # nf-core/demo pulls containers and runs FastQC, seqtk and MultiQC; it is
    # minutes, not seconds.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Confirm the Docker daemon is up
        # The test skips when Docker is unreachable, which would turn a broken
        # runner into a silent pass. Fail loudly here instead.
        run: docker info

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Install helixsh
        run: python -m pip install .

      - name: Execute nf-core/demo under -profile test,docker
        run: python -m pytest -m integration_nfcore -v

      - name: Upload Nextflow logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-logs
          path: |
            /tmp/pytest-*/**/.nextflow.log
            /tmp/pytest-*/**/*.log
          if-no-files-found: ignore
          retention-days: 7
