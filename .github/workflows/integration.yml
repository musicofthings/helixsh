name: nf-core execution

# Runs a real nf-core pipeline under `-profile test,docker`. That composition
# is the one thing no other check executes: the local tier requests no profile
# at all, and the unit tests only assert the string we build.
#
# It pulls containers and takes minutes, so it runs when a change could
# plausibly break execution rather than on every push -- and on demand. It is
# deliberately not scheduled: a nightly on a small team goes red for reasons
# nobody owns, and teaches everyone to ignore CI.
on:
  pull_request:
    paths:
      - "src/helixsh/nextflow.py"
      - "src/helixsh/executor.py"
      - "src/helixsh/cli.py"
      - "src/helixsh/preflight.py"
      - "tests/test_integration_execution.py"
      - "tests/fixtures/**"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

concurrency:
  group: nfcore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nfcore-execution:
    name: Real nf-core pipeline, Docker
    runs-on: ubuntu-24.04
    # nf-core/demo pulls containers and runs FastQC, seqtk and MultiQC; it is
    # minutes, not seconds.
    timeout-minutes: 45
    env:
      # Pin the runner. `get.nextflow.io` installs whatever is newest, which
      # makes this suite a canary for Nextflow releases rather than a check on
      # this repository -- 26.04.6 tightened the config parser and rejected an
      # nf-core pipeline that had been fine for years. Bump deliberately.
      NXF_VER: "25.04.6"
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Confirm the Docker daemon is up
        # The test skips when Docker is unreachable, which would turn a broken
        # runner into a silent pass. Fail loudly here instead.
        run: docker info

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Install helixsh
        run: python -m pip install .

      - name: Execute nf-core/demo under -profile test,docker
        run: python -m pytest -m integration_nfcore -v

      - name: Upload Nextflow logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-logs
          path: |
            /tmp/pytest-*/**/.nextflow.log
            /tmp/pytest-*/**/*.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
