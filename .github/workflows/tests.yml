name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml, plus the current release.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      # helixsh has no runtime dependencies; installing it verifies the
      # packaging metadata (including requires-python) alongside the tests.
      - name: Install helixsh
        run: python -m pip install .

      - name: Run tests
        run: python -m pytest -q

  integration:
    name: Real Nextflow execution
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Pin the runner. `get.nextflow.io` installs whatever is newest, which
      # makes this suite a canary for Nextflow releases rather than a check on
      # this repository -- 26.04.6 tightened the config parser and rejected an
      # nf-core pipeline that had been fine for years. Bump deliberately.
      NXF_VER: "25.10.4"
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Install helixsh
        run: python -m pip install .

      # Needs no container runtime and finishes in seconds, so it belongs in
      # the suite every change runs rather than on a schedule nobody watches.
      - name: Execute a real workflow through the Helixsh execution path
        run: python -m pytest -m integration -v

  desktop:
    runs-on: ubuntu-24.04
    env:
      # The desktop unit tests exercise pure-JS argument building, so the
      # ~100MB Electron binary is not needed to run them.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run desktop unit tests
        run: npm run desktop:test

      - name: Check main-process syntax
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/renderer/app.js
          node --check desktop/renderer/theme.js
          node --check scripts/package_desktop.cjs
