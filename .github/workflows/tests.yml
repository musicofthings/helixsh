name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml, plus the current release.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      # helixsh has no runtime dependencies; installing it verifies the
      # packaging metadata (including requires-python) alongside the tests.
      - name: Install helixsh
        run: python -m pip install .

      - name: Run tests
        run: python -m pytest -q

  desktop:
    runs-on: ubuntu-24.04
    env:
      # The desktop unit tests exercise pure-JS argument building, so the
      # ~100MB Electron binary is not needed to run them.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run desktop unit tests
        run: npm run desktop:test

      - name: Check main-process syntax
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/renderer/app.js
          node --check scripts/package_desktop.cjs
