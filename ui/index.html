<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/helix.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>helixsh</title>
    <!-- Resolve the stored theme before the body paints. src/theme.js is the
         authority afterwards; a module script runs too late to stop a
         light-theme user seeing a dark flash on every launch. -->
    <script>
      (() => {
        const pair = { dark: "helix-dark", light: "cursor-light" };
        let choice = "system";
        try {
          choice = localStorage.getItem("helixsh.theme") || "system";
        } catch {}
        document.documentElement.dataset.theme =
          choice === "system"
            ? pair[matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"]
            : choice;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
